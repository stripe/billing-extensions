$schema: https://stripe.com/stripe-app/v2.0.0/schema
id: com.stripe.billing.extensions
name: Stripe Billing Configurations
version: 1.0.1
icon: ./assets/icon.png
declarations:
  distribution_type: public
  sandbox_install_compatible: true
extensions:
  - id: prorate_by_custom_interval
    name: Prorate by custom interval
    description: |
      Configure how time is rounded during proration computations by selecting an interval and a rounding mode. Rounding is anchored to the billing cycle's start date and time.
    interface_id: billing.prorations
    version: 1.0.1
    configuration:
      input_schema:
        type: json_schema
        content: extensions/prorate_by_custom_interval/generated/config.schema.json
      ui_schema:
        type: jsonforms
        content: extensions/prorate_by_custom_interval/generated/config.ui.json
    script:
      type: typescript
      content: extensions/prorate_by_custom_interval/src/index.ts
    permissions: []
    methods:
      prorate_items:
        implementation_type: script
  - id: separate_invoice_for_metered_items
    name: Separate invoice for metered items
    description: |
      If a subscription contains both metered and licensed products, the items are routed to different invoices based on the item's pricing type (metered or licensed).
    interface_id: billing.recurring_billing_item_handling
    version: 1.0.1
    configuration:
      input_schema:
        type: json_schema
        content: extensions/separate_invoice_for_metered_items/generated/config.schema.json
      ui_schema:
        type: jsonforms
        content: extensions/separate_invoice_for_metered_items/generated/config.ui.json
    script:
      type: typescript
      content: extensions/separate_invoice_for_metered_items/src/index.ts
    permissions: []
    methods:
      before_item_creation:
        implementation_type: script
      filter_items:
        implementation_type: script
      group_items:
        implementation_type: script
  - id: minimum_amount_before_collection
    name: Minimum amount before collection
    description: |
      Stripe will defer the amount owed on an invoice as a debit to the customer balance until the total of the amount owed and the customer's balance surpasses the configured minimum amount.
    interface_id: billing.customer_balance_application
    version: 1.0.1
    configuration:
      input_schema:
        type: json_schema
        content: extensions/minimum_amount_before_collection/generated/config.schema.json
      ui_schema:
        type: jsonforms
        content: extensions/minimum_amount_before_collection/generated/config.ui.json
    script:
      type: typescript
      content: extensions/minimum_amount_before_collection/src/index.ts
    permissions: []
    methods:
      compute_applied_customer_balance:
        implementation_type: script
  - id: maximum_credit_amount_per_invoice
    name: Maximum credit per invoice
    description: |
      Apply a global maximum to credits applied from a customer's balance to a given invoice.
    interface_id: billing.customer_balance_application
    version: 1.0.1
    configuration:
      input_schema:
        type: json_schema
        content: extensions/maximum_credit_amount_per_invoice/generated/config.schema.json
      ui_schema:
        type: jsonforms
        content: extensions/maximum_credit_amount_per_invoice/generated/config.ui.json
    script:
      type: typescript
      content: extensions/maximum_credit_amount_per_invoice/src/index.ts
    permissions: []
    methods:
      compute_applied_customer_balance:
        implementation_type: script
  - id: credit_and_debit_full_product_price
    name: Credit and debit full product price
    description: |
      When prorating a product with particular metadata, this script will charge or refund the full cost instead of the prorated amount. As an example, if you upgrade from product A to B mid-cycle, this script fully credits the charge for product A and fully charges for product B.
    interface_id: billing.prorations
    version: 1.0.1
    configuration:
      input_schema:
        type: json_schema
        content: extensions/credit_and_debit_full_product_price/generated/config.schema.json
      ui_schema:
        type: jsonforms
        content: extensions/credit_and_debit_full_product_price/generated/config.ui.json
    script:
      type: typescript
      content: extensions/credit_and_debit_full_product_price/src/index.ts
    permissions: []
    methods:
      prorate_items:
        implementation_type: script
